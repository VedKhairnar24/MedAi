{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="login-container">
  <div class="login-card">
    <div class="text-center mb-5">
      <div class="mb-3">
        <i class="fas fa-user-plus fa-4x login-icon" style="color: var(--teal)"></i>
      </div>
      <h2 class="fw-bold mb-1">Create Your Account</h2>
      <p class="text-muted mb-0">Join MedAI and take control of your health</p>
    </div>

    <form method="POST">
      <div class="mb-3">
        <label class="form-label"><i class="fas fa-user me-2" style="color: var(--teal)"></i>Full Name</label>
        <input type="text" name="name" class="form-control" placeholder="Enter your full name" required/>
      </div>

      <div class="mb-3">
        <label class="form-label"><i class="fas fa-envelope me-2" style="color: var(--teal)"></i>Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="you@example.com" required/>
      </div>

      <div class="mb-3">
        <label class="form-label"><i class="fas fa-lock me-2" style="color: var(--teal)"></i>Create Password</label>
        <input type="password" name="password" class="form-control" placeholder="Create a strong password" required/>
        <small class="text-muted d-block mt-1">Use at least 8 characters with letters and numbers</small>
      </div>

      <div class="mb-4">
        <label class="form-label"><i class="fas fa-id-badge me-2" style="color: var(--teal)"></i>Register As</label>
        <select name="role" class="form-select">
          <option value="patient" selected>👤 Patient</option>
        </select>
      </div>

      <button type="submit" class="btn btn-teal w-100 py-2 fw-bold">
        <i class="fas fa-user-check me-2"></i>Create Account
      </button>
    </form>

    <div style="position: relative; margin: 20px 0;">
      <div style="position: absolute; left: 0; top: 50%; width: 100%; height: 1px; background: var(--border-light);"></div>
      <div style="position: relative; text-align: center; background: var(--card-bg);"><span class="text-muted small px-2" style="font-size: 0.8rem;">OR</span></div>
    </div>

    <p class="text-center mb-0 small">
      Already have an account? <a href="{{ url_for('login') }}" style="color: var(--teal); text-decoration: none; font-weight: 700; transition: all 0.3s;">Sign In</a>
    </p>
  </div>
</div>
{% endblock %}
