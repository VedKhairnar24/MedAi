{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="login-container">
  <div class="login-card">
    <div class="text-center mb-4">
      <i class="fas fa-heartbeat fa-3x login-icon" style="color:#028090"></i>
      <h2 class="fw-bold mt-3">MedAI</h2>
      <p class="text-muted mb-0">Intelligent Health Assistant</p>
    </div>

    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="you@example.com" required/>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required/>
      </div>
      <button type="submit" class="btn btn-teal w-100 py-2 mb-3">
        <i class="fas fa-sign-in-alt me-2"></i>Sign In
      </button>
    </form>

    <hr style="opacity: 0.2;">

    <p class="text-center mb-0 small">
      New here? <a href="{{ url_for('register') }}" style="color: var(--teal); text-decoration: none; font-weight: 600;">Create account</a>
    </p>

    <div class="demo-credentials mt-3">
      <p class="small fw-bold mb-2"><i class="fas fa-info-circle me-2" style="color: var(--teal);"></i>Demo Credentials:</p>
      <div class="small mb-1">
        <strong>Admin:</strong><br>
        <code>admin@medai.com</code> / <code>admin123</code>
      </div>
      <div class="small">
        <strong>Doctor:</strong><br>
        <code>priya@medai.com</code> / <code>Doctor@123</code>
      </div>
    </div>
  </div>
</div>
{% endblock %}
